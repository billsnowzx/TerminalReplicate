version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: macro
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: macro
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://macro:macro@db:5432/macro
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - db

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://macro:macro@db:5432/macro
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  timescale-data:
